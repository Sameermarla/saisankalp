# =================================================================
#   Sai Sankalp Email Server Configuration (SMTP)
# =================================================================
# To send order emails, configure your email credentials here.
#
# If you use Gmail, you must generate an App Password:
# 1. Enable 2-Step Verification in your Google Account.
# 2. Search for "App Passwords" and generate a password for "Mail".
# 3. Paste the 16-character code here as sender.password.
# =================================================================

# SMTP Server Details
smtp.host=smtp.gmail.com
smtp.port=587

# Credentials of the sender account
sender.email=your-gmail-address@gmail.com
sender.password=your-gmail-app-password-here

# Email address of the Host (where order notifications will be sent)
receiver.email=host-receipt-email@gmail.com
